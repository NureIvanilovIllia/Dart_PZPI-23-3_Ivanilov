include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
    strict-inference: true

linter:
  rules:
    - avoid_positional_boolean_parameters
    - unnecessary_lambdas
    - prefer_final_locals
    - prefer_final_in_for_each
    - public_member_api_docs
